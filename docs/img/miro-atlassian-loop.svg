<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">miro-atlassian-skills</title>
  <desc id="desc">Animated banner: Miro board skills flowing to Atlassian Confluence</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111A2E"/>
      <stop offset="100%" stop-color="#0A1F3D"/>
    </linearGradient>
    <linearGradient id="miroGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#FFD02F"/>
    </linearGradient>
    <linearGradient id="atlGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2684FF"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#7BA3D4" stroke-width="1">
    <path d="M0 70 H1280 M0 140 H1280 M0 210 H1280 M0 280 H1280 M0 350 H1280"/>
    <path d="M160 0 V420 M320 0 V420 M480 0 V420 M640 0 V420 M800 0 V420 M960 0 V420 M1120 0 V420"/>
  </g>

  <!-- Miro card -->
  <g transform="translate(120,95)">
    <rect width="280" height="230" rx="28" fill="#1A2338" stroke="#3A4A68" stroke-width="2"/>
    <rect x="28" y="28" width="224" height="174" rx="18" fill="url(#miroGlow)" filter="url(#soft)"/>
    <rect x="48" y="52" width="72" height="52" rx="8" fill="#FFF7B8" opacity="0.95"/>
    <rect x="132" y="52" width="92" height="52" rx="8" fill="#FFF1A0" opacity="0.9"/>
    <rect x="48" y="118" width="176" height="58" rx="8" fill="#FFE98A" opacity="0.95"/>
    <circle cx="84" cy="78" r="6" fill="#1A1A1A"/>
    <path d="M84 84 C110 110, 150 100, 176 78" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
    <text x="140" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFD02F">Miro</text>
  </g>

  <!-- Atlassian / Confluence card -->
  <g transform="translate(880,95)">
    <rect width="280" height="230" rx="28" fill="#1A2338" stroke="#3A4A68" stroke-width="2"/>
    <rect x="28" y="28" width="224" height="174" rx="18" fill="url(#atlGlow)" filter="url(#soft)"/>
    <rect x="56" y="56" width="168" height="118" rx="10" fill="#E8F2FF" opacity="0.95"/>
    <rect x="72" y="74" width="110" height="10" rx="5" fill="#0052CC"/>
    <rect x="72" y="96" width="136" height="8" rx="4" fill="#8FB7FF"/>
    <rect x="72" y="114" width="120" height="8" rx="4" fill="#8FB7FF"/>
    <rect x="72" y="132" width="96" height="8" rx="4" fill="#8FB7FF"/>
    <text x="140" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2684FF">Atlassian</text>
  </g>

  <!-- Flow path -->
  <path id="flow" d="M400 210 C520 120, 760 300, 880 210" fill="none" stroke="#7BA3D4" stroke-width="3" stroke-dasharray="10 10" opacity="0.55"/>
  <path d="M400 210 C520 300, 760 120, 880 210" fill="none" stroke="#5C7A9E" stroke-width="2" stroke-dasharray="6 12" opacity="0.35"/>

  <!-- Looping packets -->
  <g>
    <circle r="8" fill="#FFD02F">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M400 210 C520 120, 760 300, 880 210"/>
    </circle>
    <circle r="6" fill="#FFE566">
      <animateMotion dur="3.2s" begin="1.05s" repeatCount="indefinite" path="M400 210 C520 120, 760 300, 880 210"/>
    </circle>
    <circle r="8" fill="#2684FF">
      <animateMotion dur="3.2s" begin="0.4s" repeatCount="indefinite" path="M880 210 C760 120, 520 300, 400 210"/>
    </circle>
    <circle r="6" fill="#8FB7FF">
      <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M880 210 C760 120, 520 300, 400 210"/>
    </circle>
  </g>

  <!-- Center title -->
  <text x="640" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">miro-atlassian-skills</text>
  <text x="640" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#A9B8D0">Diagrams on Miro · Publish to Confluence</text>

  <!-- Soft pulse on cards -->
  <rect x="120" y="95" width="280" height="230" rx="28" fill="none" stroke="#FFD02F" stroke-width="2" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="880" y="95" width="280" height="230" rx="28" fill="none" stroke="#2684FF" stroke-width="2" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>

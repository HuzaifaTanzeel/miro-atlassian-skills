# Prompts for checking that each skill triggers and behaves as intended.
# Run each prompt in a fresh chat with the skills installed and both MCP servers connected.
# `expect` lists what a reviewer checks; `must_not` lists failures.

- id: uc-basic
  skill: miro-use-case-diagram
  prompt: >
    Draw a use case diagram for an expense claims service. Employees submit claims with a receipt
    and track status. Approvers approve claims or ask for more info. Sign-in uses the company identity provider.
  expect:
    - Confirms actors and use cases in one short list before drawing.
    - One frame titled "[UC] ..." placed to the right of existing frames.
    - System boundary with use cases inside, actors outside, system actor drawn as a «system» box.
    - «include» and «extend» dashed, labelled, pointing the UML way.
    - Legend and footer present; map row added.
  must_not:
    - Creates a new board without asking.
    - Connects actors to each other or use cases with arrows between steps.

- id: seq-basic
  skill: miro-sequence-diagram
  prompt: >
    Sequence diagram: a control owner uploads evidence in the web app, the API stores the file in object storage,
    records it in the database, and notifies the reviewer. Show the case where the file type is rejected.
  expect:
    - Mermaid sequenceDiagram widget inside a "[SEQ] ..." frame.
    - Actor for the control owner, participants for the rest, alt fragment for the rejected file.
    - Only Mermaid 10 syntax.
  must_not:
    - Draws lifelines by hand with shapes.
    - Uses features listed as forbidden in notation.md.

- id: dfd-context
  skill: miro-data-flow-diagram
  prompt: >
    Level 0 data flow diagram for our compliance platform. Users, auditors, an identity provider,
    and a cloud storage vendor outside the country. Mark personal data and cross-border flows.
  expect:
    - "[DFD-0] ..." frame with one process "0", external entities, no data stores.
    - Every flow labelled with a noun phrase; [PD] and [X-border] markers in purple.
    - Trust boundary around the platform and around the foreign vendor.
  must_not:
    - Flows between two external entities.
    - Verb labels on flows, or unlabelled flows.

- id: dfd-level1
  skill: miro-data-flow-diagram
  prompt: Now break the platform process into level 1.
  expect:
    - New "[DFD-1] ..." frame; flows to and from external entities match level 0 (balancing).
    - Processes numbered 1.0, 2.0, ...; data stores D1, D2, ...

- id: publish-existing
  skill: miro-to-confluence
  prompt: Publish the [SEQ] diagram to the Sequence Diagrams page.
  expect:
    - Page and frame found from the map with no Confluence search.
    - PNG made with frame-to-png.mjs, uploaded as an attachment, shown with a media figure.
    - Description with Purpose, Scope, Elements, Key flows, Assumptions and open questions, plus Mermaid source.
    - One map write-through with page and frame links.
  must_not:
    - Embeds a Miro board or iframe, or adds a board URL.
    - Rewrites other sections of the page.

- id: publish-new-page
  skill: miro-to-confluence
  prompt: Put the use case diagram on a new page under the design folder.
  expect:
    - Uses the Diagram targets template if listed, otherwise the built-in layout.
    - New page row added to the map.

- id: publish-refresh
  skill: miro-to-confluence
  prompt: I changed the DFD frame on Miro; update it on Confluence.
  expect:
    - Same attachment filename uploaded as a new version; the existing section replaced, not duplicated.
    - Change history row added.

- id: map-bootstrap
  skill: workspace-map
  prompt: Build the workspace map for Confluence space KEY and Miro board <board URL>.
  expect:
    - Reads the tree with getConfluenceContentDescendants, not page bodies.
    - Asks before creating the Workspace map page.
    - Writes config, cache, and the AGENTS.md pointer line; reports counts.
  must_not:
    - Reads Jira issues or copies them into the map.

- id: map-where
  skill: workspace-map
  prompt: Where is the data model page?
  expect:
    - Answers from the cache after one version check, no search.

- id: map-stale
  skill: workspace-map
  prompt: Someone added pages by hand last week; resync the map.
  expect:
    - CQL lastmodified since the scanned date, scoped to the space; Miro frame-id diff.
    - One map write.

- id: negative-whiteboard
  skill: none
  prompt: Make a Confluence whiteboard for brainstorming.
  expect:
    - No skill from this suite triggers.

<textArea x="64" y="1032" width="900" font-family="noto_sans" font-size="16" fill="#595959">Solid line: the actor takes part in the use case.<br/>Dashed &#171;include&#187;: the base always runs the included use case.<br/>Dashed &#171;extend&#187;: optional behaviour added to the base when the condition holds.<br/>Blue: user goal. Yellow: shared sub-goal. Orange: extension. Gray: external system.</textArea>
<textArea x="1036" y="1104" width="500" font-family="noto_sans" font-size="16" text-align="right" fill="#595959">Status: Draft | v1 | 2026-01-01</textArea>

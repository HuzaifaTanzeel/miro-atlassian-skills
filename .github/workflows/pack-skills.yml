# A push to a branch other than main, when skills change, rebuilds claude-upload/*.zip
# on that same branch. Merging the pull request is what puts the zips on main and
# replaces the previous files. main only accepts pull requests, so this job never pushes there.
# The commit only touches claude-upload/, which is outside the path filter, so it does not run again.
# Each zip is one skill folder, <name>/SKILL.md, for Claude.ai custom-skill upload.

name: Pack Claude skill zips

on:
  push:
    branches-ignore: [main]
    paths:
      - "skills/**"
      - "scripts/pack-skills.mjs"
      - ".github/workflows/pack-skills.yml"

concurrency:
  group: pack-claude-skill-zips-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Add zips to this branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          node scripts/pack-skills.mjs
          git add -A -- claude-upload
          if git diff --staged --quiet; then
            echo "Zips already match this branch."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh Claude skill zips."
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

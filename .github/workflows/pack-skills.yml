# Zips are committed on the pull request, not on a branch push and not on main.
# Opening the pull request (or marking a draft ready) writes claude-upload/*.zip.
# Merging the pull request is what puts those files on main and replaces the previous ones.
# main only accepts pull requests, so this job never pushes there.
# The commit only touches claude-upload/, outside the path filter, and a
# GITHUB_TOKEN push does not start another run.
# Each zip is one skill folder, <name>/SKILL.md, for Claude.ai upload.

name: Pack Claude skill zips

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
    paths:
      - "skills/**"
      - "scripts/pack-skills.mjs"
      - ".github/workflows/pack-skills.yml"

concurrency:
  group: pack-claude-skill-zips-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pack:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Add zips to the pull request
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git rebase "origin/$GITHUB_HEAD_REF"
          node scripts/pack-skills.mjs
          git add -A -- claude-upload
          if git diff --staged --quiet; then
            echo "Zips already match this pull request."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh Claude skill zips."
          git push origin "HEAD:$GITHUB_HEAD_REF"

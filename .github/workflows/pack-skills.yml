# After a pull request merges to main and skills/ changed, replace claude-upload/*.zip.
# Each zip is one skill, with SKILL.md at the root, for Claude.ai custom-skill upload.
# The commit only touches claude-upload/, which is outside the path filter, so it does not run again.
# main's ruleset must let the GitHub Actions app bypass it, or the push of these zips is rejected.

name: Pack Claude skill zips

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/pack-skills.mjs"
      - ".github/workflows/pack-skills.yml"

concurrency:
  group: pack-claude-skill-zips
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Overwrite zips on main
        run: |
          git fetch origin main
          git rebase origin/main
          node scripts/pack-skills.mjs
          git add -A -- claude-upload
          if git diff --staged --quiet; then
            echo "Zips already match main."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh Claude skill zips."
          git push origin HEAD:main
